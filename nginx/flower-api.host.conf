# Template only. Install during an explicitly authorized production window.
server {
    listen 80;
    server_name flower-api.bkeel.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name flower-api.bkeel.com;
    ssl_certificate /etc/letsencrypt/live/flower-api.bkeel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flower-api.bkeel.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 11m;
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
