services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.11}
    environment:
      POSTGRES_DB: flower
      POSTGRES_USER: flower
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set independent database password}
    networks: [db]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U flower -d flower"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    image: flower-app:${IMAGE_TAG:?set immutable commit SHA}
    environment: &app-env
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?set independent database URL}
      SECRET_KEY: ${SECRET_KEY:?set independent signing key}
      APP_BASE_URL: ${APP_BASE_URL:-https://flower-api.bkeel.com}
      DEV_MODE: ${DEV_MODE:-false}
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-false}
      UPLOAD_DIR: /data/uploads
      SOFTWARE_VERSION: ${IMAGE_TAG}
      JOB_MAX_CONCURRENCY: "1"
      FALLBACK_RENEW_BEFORE_SEC: ${FALLBACK_RENEW_BEFORE_SEC:-86400}
      PROVIDER_MODE: ${PROVIDER_MODE:-mock}
      PROVIDER_BASE_URL: ${PROVIDER_BASE_URL:-}
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
    networks: [app, db]
    volumes: [uploads:/data/uploads]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
  worker:
    image: flower-app:${IMAGE_TAG:?set immutable commit SHA}
    command: [python, -m, flower.worker]
    environment: *app-env
    networks: [app, db]
    volumes: [uploads:/data/uploads]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, flower.worker, --health]
      interval: 15s
      timeout: 5s
      retries: 4
  proxy:
    image: ${PROXY_IMAGE:-nginxinc/nginx-unprivileged:1.28.0-alpine}
    volumes: [./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [app]
    depends_on:
      api: {condition: service_healthy}
networks:
  app: {}
  db: {internal: true}
volumes:
  postgres-data: {}
  uploads: {}
